neo_version = "21.4.158"
neo_version_range = "[21.4,21.5)"
parchment_mappings_version = "2025.03.23"

# [overrides.<mod_id>."<mc_version>"] overrides the ["<mc_version>"] block above,
# field by field, for that mod_id only. No need to declare every field: whatever's
# missing is inherited from that version's base block. Example:
#
# [overrides.mod."1.21.1"]
# neo_version = "21.1.180"
# neo_version_range = "[21.1,21.2)"
#
# [overrides.mod."1.21.4"]
# parchment_mappings_version = "2025.02.09"

# Version profiles: reusable named lists, so you don't repeat the same list in
# every mod.stonecutter.properties.toml. A mod uses them like this, in its own
# [stonecutter] table, instead of listing "versions" by hand:
#
#   [stonecutter]
#   profile = "legacy"
#   extra_versions = ["26.1"]      # optional: adds versions to the profile
#   exclude_versions = ["1.21.4"]  # optional: removes versions from the profile
#
# If a mod sets "versions" directly, that always wins and
# "profile"/"extra_versions"/"exclude_versions" are ignored --
# 100% backwards-compatible, doesn't break any existing mod.
#
# The per-version data block (minecraft_version, neo_version, etc.) can live
# here (shared) or in the mod's own TOML -- a profile only names versions, it
# doesn't matter where each ["<version>"] block is defined. A mod can also
# declare its own [stonecutter.profiles.*] if it needs a custom profile that
# doesn't make sense to share.
#
# To quickly test a subset without touching any TOML:
#   ./gradlew build -Pstonecutter.versions=1.21.1,26.1
# ---------------------------------------------------------------------------

[stonecutter.profiles.legacy]
versions = ["1.21.1", "1.21.3", "1.21.4"]

[stonecutter.profiles.current]
versions = ["1.21.1"]
