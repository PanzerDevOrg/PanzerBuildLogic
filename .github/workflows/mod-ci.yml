name: Mod CI (reusable)

# The whole pipeline of every mod, configured by its mod.stonecutter.properties.toml
# (each mod's .github/workflows/ci.yml only calls this):
#
#   plan     reads the TOML (tools/panzer.py ci plan): native build matrix, JDKs,
#            dependencies built from source, Maven publishing; warns when the
#            mod's shared files differ from panzer-build-logic (`panzer check`)
#   natives  every CMake-backed [natives.<name>] platform, built and self-tested
#            on its own runner (ci_linux_script: all Linux platforms in one job,
#            ci_prepare: run first, e.g. to vendor sources). Skipped when the
#            native sources are unchanged since a build cached on master; a
#            v* tag always builds them afresh.
#   build    every Minecraft version with tests; universal, per-system and
#            sources jars, verified (tools/panzer.py ci verify-jars)
#   maven    v* tags with [publish] maven_pages = true: the mod's static Maven
#            repository on its gh-pages branch
#   release  mod-release.yml: GitHub release, Modrinth, CurseForge. A dry run
#            with a private "release-preview" artifact on every push; real only
#            on v* tags (unless a manual run keeps dry_run ticked)
#
# mod-repository lets panzer-build-logic build any mod from its own Actions tab
# (.github/workflows/mods.yml); such runs never publish.
on:
  workflow_call:
    inputs:
      dry-run:
        description: '"true"/"false" from a manual run of the caller, empty otherwise'
        type: string
        default: ""
      targets:
        type: string
        default: github,modrinth,curseforge
      mod-repository:
        description: Owner/Repo of the mod (default the calling repository)
        type: string
        default: ""
      mod-ref:
        type: string
        default: ""
      build-logic-ref:
        type: string
        default: master
      versions:
        description: Build only these Minecraft versions (comma-separated; may name ones the mod excludes, to try a port)
        type: string
        default: ""

env:
  PANZER: panzer-build-logic/tools/panzer.py

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mod-id: ${{ steps.plan.outputs.mod-id }}
      version: ${{ steps.plan.outputs.version }}
      natives: ${{ steps.plan.outputs.natives }}
      has-natives: ${{ steps.plan.outputs.has-natives }}
      natives-key: ${{ steps.plan.outputs.natives-key }}
      natives-cached: ${{ steps.natives-cache.outputs.cache-hit == 'true' }}
      strict-natives: ${{ steps.plan.outputs.strict-natives }}
      java: ${{ steps.plan.outputs.java }}
      source-deps: ${{ steps.plan.outputs.source-deps }}
      gradle-tasks: ${{ steps.plan.outputs.gradle-tasks }}
      display: ${{ steps.plan.outputs.display }}
      jars-artifact: ${{ steps.plan.outputs.jars-artifact }}
      maven-pages: ${{ steps.plan.outputs.maven-pages }}
      publish: ${{ steps.publish.outputs.publish }}
      gradle-versions: ${{ steps.plan.outputs.gradle-versions }}
      cache-key: ${{ steps.plan.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.mod-repository || github.repository }}
          ref: ${{ inputs.mod-ref }}
          token: ${{ inputs.mod-repository && secrets.PANZER_SYNC_TOKEN || github.token }}
          path: mod
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          ref: ${{ inputs.build-logic-ref }}
          path: panzer-build-logic
          persist-credentials: false

      - name: Plan from mod.stonecutter.properties.toml
        id: plan
        env:
          VERSIONS: ${{ inputs.versions }}
        run: python3 "$PANZER" ci plan --mod mod --github-output --versions "$VERSIONS"

      # Publishing happens only for a v* tag of the mod's own repository, and
      # never when a manual run keeps dry_run ticked.
      - name: Publish or dry run
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          FROM_BUILD_LOGIC: ${{ inputs.mod-repository }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* && "$DRY_RUN" != "true" && -z "$FROM_BUILD_LOGIC" && -z "$VERSIONS" ]]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publish: $publish (ref $GITHUB_REF)"

      - name: Shared files up to date
        continue-on-error: true
        run: python3 "$PANZER" check mod --ci

      # Native builds of these exact sources, if a run already cached them.
      # Never for a release tag: what it publishes is built from the tag.
      - name: Cached native builds
        id: natives-cache
        if: steps.plan.outputs.has-natives == 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@v4
        with:
          path: native-out
          key: ${{ steps.plan.outputs.natives-key }}
          lookup-only: true

  natives:
    needs: plan
    if: needs.plan.outputs.has-natives == 'true' && needs.plan.outputs.natives-cached != 'true'
    name: native ${{ matrix.lib }} ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.natives) }}
    defaults:
      run:
        shell: bash
        working-directory: mod
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.mod-repository || github.repository }}
          ref: ${{ inputs.mod-ref }}
          token: ${{ inputs.mod-repository && secrets.PANZER_SYNC_TOKEN || github.token }}
          path: mod
          persist-credentials: false
      # JNI headers for libraries that need them (JAVA_HOME/include).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare (${{ matrix.prepare }})
        if: matrix.prepare != ''
        run: bash "${{ matrix.prepare }}"

      - name: Build with ${{ matrix.script }}
        if: matrix.script != ''
        run: bash "${{ matrix.script }}"

      # Builds every ISA variant the project has and runs its CTest suite (e.g.
      # cp_selftest checks each one the runner's CPU supports).
      - name: CMake build and self-test
        if: matrix.script == ''
        env:
          CMAKE_DIR: ${{ matrix.cmake_dir }}
          PLATFORM: ${{ matrix.platform }}
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          cmake -S "$CMAKE_DIR" -B "build-native/$PLATFORM" -DCMAKE_BUILD_TYPE=Release
          cmake --build "build-native/$PLATFORM" --config Release --parallel
          ctest --test-dir "build-native/$PLATFORM" -C Release --output-on-failure --no-tests=ignore
          dest="natives/${PLATFORM%%-*}/${PLATFORM#*-}"
          mkdir -p "$dest"
          find "build-native/$PLATFORM" -name "$FILE" -exec cp {} "$dest/" \;

      - name: Collect
        env:
          OUTPUTS: ${{ matrix.outputs }}
        run: |
          set -euo pipefail
          for f in $OUTPUTS; do
            [ -f "$f" ] || { echo "::error::$f was not built"; exit 1; }
            mkdir -p "../out/$(dirname "$f")"
            cp "$f" "../out/$f"
            ls -l "../out/$f"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ needs.plan.outputs.mod-id }}-${{ matrix.lib }}-${{ matrix.key }}
          path: out/
          if-no-files-found: error

  build:
    needs: [plan, natives]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.natives.result == 'success' || needs.natives.result == 'skipped') }}
    name: Build every version + package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      # settings.gradle.kts includeBuild()s ../panzer-build-logic, so the
      # repositories sit side by side under the workspace.
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.mod-repository || github.repository }}
          ref: ${{ inputs.mod-ref }}
          token: ${{ inputs.mod-repository && secrets.PANZER_SYNC_TOKEN || github.token }}
          path: mod
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          ref: ${{ inputs.build-logic-ref }}
          path: panzer-build-logic
          persist-credentials: false

      - name: JDKs and Gradle caches
        uses: ./panzer-build-logic/.github/actions/gradle-env
        with:
          java: ${{ needs.plan.outputs.java }}
          cache-key: ${{ needs.plan.outputs.cache-key }}

      # [depends_on.<id>] ci_build_from_source: that mod's default branch,
      # published to mavenLocal (which the build resolves first), for
      # dependencies whose version is not released yet. The token only exists
      # in the clone step (as an HTTP header, never in a URL or .git/config);
      # the Gradle builds run without it.
      - name: Fetch dependencies built from source
        if: needs.plan.outputs.source-deps != '[]'
        env:
          DEPS: ${{ needs.plan.outputs.source-deps }}
          TOKEN: ${{ inputs.mod-repository && secrets.PANZER_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          echo "$DEPS" | python3 -c 'import json,sys; [print(d["id"], d["repo"]) for d in json.load(sys.stdin)]' |
          while read -r id repo; do
            git clone --depth 1 "https://github.com/${repo}.git" "../dep-$id"
          done

      - name: Build dependencies from source
        if: needs.plan.outputs.source-deps != '[]'
        env:
          DEPS: ${{ needs.plan.outputs.source-deps }}
        run: |
          set -euo pipefail
          echo "$DEPS" | python3 -c 'import json,sys; [print(d["id"], d["repo"], d["versions"]) for d in json.load(sys.stdin)]' |
          while read -r id repo versions; do
            echo "::group::$repo -> mavenLocal ($versions)"
            # With its native libraries for this runner (CMake): a dependency's tests
            # may need them (Velox's parity check requires Celeris's native kernel).
            (cd "../dep-$id" && chmod +x gradlew && ./gradlew publishToMavenLocal -Pstonecutter.versions="$versions" \
                -Ppanzer.native.build=true $GRADLE_JDKS -x test --no-watch-fs --stacktrace)
            echo "::endgroup::"
          done

      - name: Restore cached native builds
        if: needs.plan.outputs.natives-cached == 'true'
        uses: actions/cache/restore@v4
        with:
          path: native-out
          key: ${{ needs.plan.outputs.natives-key }}
          fail-on-cache-miss: true
      - name: Download native builds
        if: needs.plan.outputs.has-natives == 'true' && needs.plan.outputs.natives-cached != 'true'
        uses: actions/download-artifact@v5
        with:
          pattern: native-${{ needs.plan.outputs.mod-id }}-*
          merge-multiple: true
          path: native-out
      - name: Cache native builds
        if: needs.plan.outputs.has-natives == 'true' && needs.plan.outputs.natives-cached != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: native-out
          key: ${{ needs.plan.outputs.natives-key }}
      - name: Stage native builds
        if: needs.plan.outputs.has-natives == 'true'
        run: cp -R ../native-out/. .

      # [ci] display = true: game clients (self-tests) need a screen and OpenGL:
      # a virtual X server, and Mesa's llvmpipe (OpenGL 4.5 in software).
      # The runner image usually has all of it already: install only what is
      # missing, and refresh the package index only if that install fails.
      - name: Virtual display
        if: needs.plan.outputs.display == 'true'
        run: |
          missing=()
          for pkg in xvfb libgl1-mesa-dri libglx-mesa0; do
            dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "ok installed" || missing+=("$pkg")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Installing ${missing[*]}"
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}" > /dev/null ||
              { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends "${missing[@]}" > /dev/null; }
          fi

      - name: Gradle ${{ needs.plan.outputs.gradle-tasks }}
        env:
          TASKS: ${{ needs.plan.outputs.gradle-tasks }}
          STRICT: ${{ needs.plan.outputs.strict-natives }}
          VERSIONS: ${{ needs.plan.outputs.gradle-versions }}
          DISPLAY_NEEDED: ${{ needs.plan.outputs.display }}
        run: |
          chmod +x ./gradlew
          wrap=()
          if [ "$DISPLAY_NEEDED" = true ]; then wrap=(xvfb-run -a -s "-screen 0 1280x720x24"); fi
          # --continue: every version builds and reports, not just the first to fail.
          "${wrap[@]}" ./gradlew $TASKS -Ppanzer.native.strict=$STRICT $VERSIONS $GRADLE_JDKS --continue --no-watch-fs --stacktrace

      # Universal jar: every declared native and the legal files; per-system
      # jars: only their OS's natives (java: none); sources jar present.
      - name: Verify jars
        run: python3 "../$PANZER" ci verify-jars --mod . ${{ needs.plan.outputs.strict-natives == 'true' && '--strict' || '' }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ needs.plan.outputs.jars-artifact }}
          path: mod/build/libs/
          if-no-files-found: error

  maven:
    # Consumers resolve <group>:<id>-<mc>:<version> from https://<owner>.github.io/<repo>/maven.
    needs: [plan, natives, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.maven-pages == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v5
        with:
          path: mod
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          ref: ${{ inputs.build-logic-ref }}
          path: panzer-build-logic
          persist-credentials: false
      - name: JDKs and Gradle caches
        uses: ./panzer-build-logic/.github/actions/gradle-env
        with:
          java: ${{ needs.plan.outputs.java }}
          cache-key: ${{ needs.plan.outputs.cache-key }}
      - name: Download native builds
        if: needs.plan.outputs.has-natives == 'true'
        uses: actions/download-artifact@v5
        with:
          pattern: native-${{ needs.plan.outputs.mod-id }}-*
          merge-multiple: true
          path: mod

      # Refuse to publish if the tag disagrees with [mod] version, so v0.2.0
      # can never ship 0.1.0 artifacts.
      - name: Check tag matches mod version
        run: |
          [ "v${{ needs.plan.outputs.version }}" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME != mod version ${{ needs.plan.outputs.version }}"; exit 1; }

      - name: Publish every version to the staging Maven tree
        run: |
          chmod +x ./gradlew
          ./gradlew publishAllPublicationsToGitHubPagesRepository -Ppanzer.native.strict=${{ needs.plan.outputs.strict-natives }} $GRADLE_JDKS --no-watch-fs --stacktrace

      - name: Publish static Maven repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./mod/build/publish-repo
          destination_dir: maven
          keep_files: true

  release:
    needs: [plan, build, maven]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.maven.result != 'failure' }}
    uses: PanzerDevOrg/PanzerBuildLogic/.github/workflows/mod-release.yml@master
    with:
      jars-artifact: ${{ needs.plan.outputs.jars-artifact }}
      dry-run: ${{ needs.plan.outputs.publish != 'true' }}
      targets: ${{ inputs.targets }}
      build-logic-ref: ${{ inputs.build-logic-ref }}
      mod-repository: ${{ inputs.mod-repository }}
      mod-ref: ${{ inputs.mod-ref }}
      preview-name: ${{ inputs.mod-repository && format('release-preview-{0}', needs.plan.outputs.mod-id) || 'release-preview' }}
    secrets: inherit
    permissions:
      contents: write
