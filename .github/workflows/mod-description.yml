name: Mod description (reusable)

# The mod's README.md is its only description. This turns it into:
#   Modrinth    pushed through the API (body + client/server sides) unless dry-run
#   CurseForge  curseforge.html, to paste once into the project's description
#               editor (Source/HTML mode). CurseForge has no API for project
#               descriptions, so this is the one manual step; the job summary
#               says when it is needed.
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
      build-logic-ref:
        description: panzer-build-logic commit for the tools (default the commit of this workflow)
        type: string
        default: ""
    secrets:
      MODRINTH_TOKEN:
        required: false

jobs:
  description:
    runs-on: ubuntu-latest
    env:
      PUBLISH: panzer-build-logic/publishing/panzer_publish.py
    steps:
      - uses: actions/checkout@v5
        with:
          path: mod
      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          ref: ${{ inputs.build-logic-ref || job.workflow_sha }}
          path: panzer-build-logic
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet markdown-it-py

      # Without the token (a private repository on GitHub Free gets no
      # organization secrets) this renders only, like the publisher skips a
      # site whose token is missing, instead of failing the run.
      - name: Render and sync
        id: sync
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          modrinth="updated from README.md"
          if [ "$DRY_RUN" = true ]; then
            modrinth="not updated (dry run)"
          elif [ -z "$MODRINTH_TOKEN" ]; then
            modrinth="not updated: MODRINTH_TOKEN is not set"
            echo "::warning::MODRINTH_TOKEN is not set, so Modrinth's description was not updated. Add it as a secret of this repository and re-run."
            DRY_RUN=true
          fi
          echo "modrinth=$modrinth" >> "$GITHUB_OUTPUT"
          python3 "$PUBLISH" sync --mod mod --out out $([ "$DRY_RUN" = true ] && echo --dry-run)

      - uses: actions/upload-artifact@v5
        with:
          name: descriptions
          path: out/

      - name: CurseForge instructions
        run: |
          {
            echo "## Descriptions"
            echo
            echo "- **Modrinth**: ${{ steps.sync.outputs.modrinth }}"
            echo "- **CurseForge**: download the **descriptions** artifact, open the project's description editor,"
            echo "  switch to *Source*/HTML and replace everything with \`curseforge.html\`."
            echo
            echo "<details><summary>curseforge.html</summary>"
            echo
            echo '```html'
            cat out/curseforge.html
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
