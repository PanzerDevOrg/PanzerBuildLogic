# {{name}} build configuration. Merged at configuration time with
# ../panzer-build-logic/common.stonecutter.properties.toml (panzer.settings):
# any table declared here replaces the common table of the same name.
# Licenses come from [legal] in the common TOML.

[mod]
id = "{{id}}"
name = "{{name}}"
group = "{{group}}"
package = "{{package}}"
version = "0.1.0"
authors = "Bichal"
description = "{{name}}: describe the mod in one sentence."
side = "BOTH"
issues = "https://github.com/{{owner}}/{{repo}}/issues"
banner = ""

# Releases and descriptions (panzer-build-logic/publishing). README.md is the
# description on GitHub, Modrinth and CurseForge. Add modrinth_id /
# curseforge_id once the projects exist; until then releases go to GitHub only.
[publish]
client_side = "required"
server_side = "required"

[stonecutter]
versions = ["1.21.1"]
vcs_version = "1.21.1"

["1.21.1"]
minecraft_version = "1.21.1"
minecraft_version_range = "[1.21.1,1.21.2)"
neo_version = "21.1.248"
neo_version_range = "[21.1,21.2)"
parchment_mappings_version = "2024.11.17"
game_versions = ["1.21.1"]
